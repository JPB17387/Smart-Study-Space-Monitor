<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Study AI</title>
<style>
  :root {
    --bg: #14181f;
    --surface: #1b212b;
    --line: #2a3140;
    --text: #eceff3;
    --muted: #8b93a3;
    --accent: #6c8eef;
    --accent-soft: rgba(108, 142, 239, 0.14);
    --warn: #d8a15c;
    --warn-soft: rgba(216, 161, 92, 0.12);
    --stop: #c96a5f;
    --stop-soft: rgba(201, 106, 95, 0.12);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Iowan Old Style", "Georgia", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 24px;
  }

  header { margin-bottom: 28px; }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 4px 0 0;
    font-family: "Segoe UI", sans-serif;
  }

  #connection-banner {
    display: none;
    font-family: "Segoe UI", sans-serif;
    font-size: 0.82rem;
    color: var(--warn);
    background: var(--warn-soft);
    border: 1px solid rgba(216, 161, 92, 0.35);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 20px;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Segoe UI", sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .status-dot.focus   { background: var(--accent); }
  .status-dot.break   { background: #7fb08a; }
  .status-dot.idle    { background: var(--warn); }
  .status-dot.stopped { background: var(--muted); }

  #status-text { color: var(--text); font-weight: 600; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 22px;
    font-family: "Segoe UI", sans-serif;
  }

  .stat {
    padding: 14px 10px;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: none; }

  .stat .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat .value { font-size: 1.15rem; font-weight: 600; }

  .recommendation {
    padding: 16px 18px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    margin-bottom: 16px;
  }

  .recommendation .label {
    font-family: "Segoe UI", sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .recommendation .text {
    font-size: 1.02rem;
    font-style: italic;
    line-height: 1.4;
  }

  #idle-warning {
    display: none;
    padding: 14px 18px;
    border-left: 3px solid var(--warn);
    background: var(--warn-soft);
    border-radius: 4px;
    margin-bottom: 28px;
    font-family: "Segoe UI", sans-serif;
  }

  #idle-warning .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--warn);
    margin-bottom: 4px;
    font-weight: 600;
  }

  #idle-warning .text { font-size: 0.9rem; color: var(--text); }

  section.controls { margin-top: 8px; }

  .controls-label {
    font-family: "Segoe UI", sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .button-row { display: flex; flex-wrap: wrap; gap: 8px; }

  button {
    font-family: "Segoe UI", sans-serif;
    flex: 1 1 130px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--surface);
    color: var(--text);
    transition: background 0.12s, border-color 0.12s, opacity 0.12s;
  }

  button:hover { background: #232a36; }
  button:active { opacity: 0.75; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #btn-start {
    background: var(--accent);
    color: #0e1522;
    border-color: var(--accent);
    flex-basis: 100%;
    padding: 14px;
    font-size: 0.95rem;
  }

  #btn-stop {
    border-color: rgba(201, 106, 95, 0.5);
    color: var(--stop);
  }
  #btn-stop:hover { background: var(--stop-soft); }

  #btn-pause, #btn-resume, #btn-break { border-color: var(--line); }

  footer {
    text-align: center;
    font-family: "Segoe UI", sans-serif;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 18px 20px 24px;
    line-height: 1.6;
  }

  @media (max-width: 420px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Smart Study AI</h1>
    <p class="subtitle">Study environment assistant</p>
  </header>

  <div id="connection-banner"></div>

  <div class="status-line">
    <span class="status-dot stopped" id="status-dot"></span>
    <span>Status: <span id="status-text">--</span></span>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Motion</div><div class="value" id="v-motion">--</div></div>
    <div class="stat"><div class="label">Light</div><div class="value" id="v-light">--</div></div>
    <div class="stat"><div class="label">Session</div><div class="value" id="v-session">--</div></div>
    <div class="stat"><div class="label">Idle</div><div class="value" id="v-idle">--</div></div>
  </div>

  <div class="recommendation">
    <div class="label">Study recommendation</div>
    <div class="text" id="v-recommendation">Waiting for data&hellip;</div>
  </div>

  <div id="idle-warning">
    <div class="label">Idle warning</div>
    <div class="text" id="idle-warning-text"></div>
  </div>

  <section class="controls">
    <div class="controls-label">Session controls</div>
    <div class="button-row">
      <button id="btn-start">Start Focus</button>
    </div>
    <div class="button-row" style="margin-top: 8px;">
      <button id="btn-pause">Pause</button>
      <button id="btn-resume">Resume</button>
      <button id="btn-break">Start Break</button>
      <button id="btn-stop">Stop</button>
    </div>
  </section>
</main>

<footer>Copyright &copy; Jhon Paul Baonil 2026<br>Smart AI Assistant Platform</footer>

<script>
const POLL_MS = 1000; // ~1 Hz telemetry poll
const IDLE_WARNING_THRESHOLD_SECONDS = 60; // mirrors SESSION_IDLE_TIMEOUT in config.h

const banner = document.getElementById('connection-banner');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const idleWarningBox = document.getElementById('idle-warning');
const idleWarningText = document.getElementById('idle-warning-text');

const els = {
  motion: document.getElementById('v-motion'),
  light: document.getElementById('v-light'),
  session: document.getElementById('v-session'),
  idle: document.getElementById('v-idle'),
  rec: document.getElementById('v-recommendation'),
};

function fmtSeconds(total) {
  const s = Math.max(0, Math.floor(total));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}

function showBanner(msg) {
  banner.textContent = msg;
  banner.style.display = msg ? 'block' : 'none';
}

function setStatus(label, cls) {
  statusText.textContent = label;
  statusDot.className = `status-dot ${cls}`;
}

function applyTelemetry(data) {
  els.motion.textContent = data.motion ? 'Detected' : 'No motion';
  els.light.textContent = `${data.light}%`;
  els.session.textContent = fmtSeconds(data.sessionTime);
  els.idle.textContent = `${Math.floor(data.idleTime)}s`;
  els.rec.textContent = data.recommendation || '--';

  showBanner(data.stale ? 'Showing last known reading -- device unreachable.' : '');

  const idleTooLong = !data.motion && data.idleTime >= IDLE_WARNING_THRESHOLD_SECONDS;

  if (idleTooLong) {
    setStatus('Idle', 'idle');
    idleWarningBox.style.display = 'block';
    idleWarningText.textContent =
      `You've been inactive for ${Math.floor(data.idleTime)}s. Return to your study session.`;
  } else {
    idleWarningBox.style.display = 'none';
    setStatus(data.focus ? 'Focus' : 'Break', data.focus ? 'focus' : 'break');
  }
}

async function pollState() {
  try {
    const res = await fetch('/api/state');
    const envelope = await res.json();

    if (envelope.type === 'error') {
      showBanner(envelope.data.message || 'Device error.');
      setStatus('Stopped', 'stopped');
      return;
    }

    applyTelemetry(envelope.data);
  } catch (err) {
    showBanner('Cannot reach the backend.');
    setStatus('Stopped', 'stopped');
  }
}

async function sendCommand(command) {
  const buttons = document.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);

  try {
    const res = await fetch(`/api/command/${command}`, { method: 'POST' });
    const envelope = await res.json();

    if (envelope.type === 'error') {
      showBanner(envelope.data.message || `Command '${command}' failed.`);
    } else {
      pollState();
    }
  } catch (err) {
    showBanner('Cannot reach the backend.');
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

document.getElementById('btn-start').addEventListener('click', () => sendCommand('start_session'));
document.getElementById('btn-pause').addEventListener('click', () => sendCommand('pause_session'));
document.getElementById('btn-resume').addEventListener('click', () => sendCommand('resume_session'));
document.getElementById('btn-stop').addEventListener('click', () => sendCommand('stop_session'));
document.getElementById('btn-break').addEventListener('click', () => sendCommand('start_break'));

pollState();
setInterval(pollState, POLL_MS);
</script>
</body>
</html>
